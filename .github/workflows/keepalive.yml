name: Supabase keepalive

on:
  schedule:
    - cron: "17 7 * * 1,3,5"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ref="${SUPABASE_URL#https://}"
          echo "Project ref: ${ref%%.*}" | sed 's/./& /g'
          for path in "rest/v1/profiles?select=id&limit=1" "auth/v1/health"; do
            curl --fail-with-body --silent --show-error --output /dev/null \
              --retry 3 --retry-delay 10 --retry-all-errors \
              "$SUPABASE_URL/$path" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"
            echo "ok: $path"
          done
